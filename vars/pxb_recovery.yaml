# --- Cluster access ---
# Absolute paths to kubeconfig files for the primary (PX-Backup) and
# secondary (restore target) clusters. Override per environment.
kubeconfig_primary: "<path-to-primary-kubeconfig>"
kubeconfig_secondary: "<path-to-secondary-kubeconfig>"

pxb_recovery_configuration_namespace: kube-system  # Stork CR location

# --- Which backend to use for BackupLocation ---
# allowed: azure, s3, nfs
pxb_recovery_configuration_backup_location_type: nfs

pxb_recovery_configuration_backup_location_name: pxb-backuplocation

# ----------------------------
# Azure Storage Account
# ----------------------------
pxb_recovery_configuration_backup_location_azure:
  path: "{{ pxb_azure_path }}"
  storage_account_name: "{{ pxb_azure_storage_account_name }}"
  storage_account_key: "{{ pxb_azure_storage_account_key }}"

# ----------------------------
# S3 / FlashBlade
# ----------------------------
pxb_recovery_configuration_backup_location_s3:
  path: "{{ pxb_s3_path }}"           # bucket[/prefix]
  endpoint: "{{ pxb_s3_endpoint }}"   # FB or AWS endpoint
  region: REGION                      # Enter region required for AWS
  access_key: "{{ pxb_s3_access_key }}"
  secret_key: "{{ pxb_s3_secret_key }}"
  disable_ssl: false
  force_path_style: true

# ----------------------------
# NFS / FlashArray NFS / generic NFS
# ----------------------------
pxb_recovery_configuration_backup_location_nfs:
  server: "{{ pxb_nfs_server }}"
  export_path: "{{ pxb_nfs_export_path }}"
  path: "{{ pxb_nfs_path }}"          # subdir within export (can be "/")

# --- App backup / restore ---
pxb_recovery_configuration_app_backup_schedule_name: central-schedule
pxb_recovery_configuration_schedule_policy_name: interval-policy
pxb_recovery_configuration_app_namespace: central          # Namespace where PX-Backup is deployed

pxb_restore_name: restore-px-backup
pxb_restore_backup_name: backup-px-backup
pxb_restore_namespace: "{{ pxb_recovery_configuration_namespace }}"
pxb_restore_backup_location: "{{ pxb_recovery_configuration_backup_location_name }}"
