---
# ----------------------------
# Cluster verification
# ----------------------------
- name: Verify access to secondary cluster
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_secondary }}"
    kind: Node
  register: pxb_restore_secondary_nodes
  changed_when: false

# Optional: ensure Stork is present
- name: Check if Stork BackupLocation CRD exists on secondary
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_secondary }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: backuplocations.stork.libopenstorage.org
  register: pxb_restore_secondary_bl_crd
  failed_when: false
  changed_when: false

- name: Set fact whether Stork is installed on secondary
  ansible.builtin.set_fact:
    pxb_restore_stork_installed_secondary: "{{ (pxb_restore_secondary_bl_crd.resources | default([]) | length) > 0 }}"

- name: Assert Stork is installed on the secondary cluster
  ansible.builtin.assert:
    that: pxb_restore_stork_installed_secondary | default(false)
    fail_msg: >-
      Stork BackupLocation CRD missing on the secondary cluster.
      Install Stork on the restore target before running the restore phase.

# ----------------------------
# ApplicationRestore
# ----------------------------
- name: Create ApplicationRestore on secondary cluster
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_secondary }}"
    state: present
    definition: "{{ lookup('template', 'application_restore.yaml') | from_yaml }}"
