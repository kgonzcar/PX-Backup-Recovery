apiVersion: stork.libopenstorage.org/v1alpha1
kind: BackupLocation
metadata:
  name: "{{ pxb_recovery_configuration_backup_location_name }}"
  namespace: "{{ pxb_recovery_configuration_namespace }}"
location:
  type: s3
  path: "{{ pxb_recovery_configuration_backup_location_s3.path }}"
  sync: true
  s3Config:
    accessKeyID: "{{ pxb_recovery_configuration_backup_location_s3.access_key }}"
    secretAccessKey: "{{ pxb_recovery_configuration_backup_location_s3.secret_key }}"
    endpoint: "{{ pxb_recovery_configuration_backup_location_s3.endpoint }}"
{% if pxb_recovery_configuration_backup_location_s3.region is defined and pxb_recovery_configuration_backup_location_s3.region %}
    region: "{{ pxb_recovery_configuration_backup_location_s3.region }}"
{% endif %}
    disableSSL: {{ pxb_recovery_configuration_backup_location_s3.disable_ssl | default(false) }}
    s3ForcePathStyle: {{ pxb_recovery_configuration_backup_location_s3.force_path_style | default(true) }}