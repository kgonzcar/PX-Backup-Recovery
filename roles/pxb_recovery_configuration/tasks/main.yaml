---
# Cluster verification
# ----------------------------
- name: Verify access to primary cluster
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_primary }}"
    kind: Node
  register: pxb_recovery_configuration_primary_nodes
  changed_when: false

- name: Verify access to secondary cluster
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_secondary }}"
    kind: Node
  register: pxb_recovery_configuration_secondary_nodes
  changed_when: false

# Stork presence checks
# ----------------------------
- name: Check if Stork BackupLocation CRD exists on primary
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_primary }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: backuplocations.stork.libopenstorage.org
  register: pxb_recovery_configuration_primary_bl_crd
  failed_when: false
  changed_when: false

- name: Set fact whether Stork is installed on primary
  ansible.builtin.set_fact:
    pxb_recovery_configuration_stork_installed_primary: "{{ (pxb_recovery_configuration_primary_bl_crd.resources | default([]) | length) > 0 }}"

- name: Check if Stork BackupLocation CRD exists on secondary
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_secondary }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: backuplocations.stork.libopenstorage.org
  register: pxb_recovery_configuration_secondary_bl_crd
  failed_when: false
  changed_when: false

- name: Set fact whether Stork is installed on secondary
  ansible.builtin.set_fact:
    pxb_recovery_configuration_stork_installed_secondary: "{{ (pxb_recovery_configuration_secondary_bl_crd.resources | default([]) | length) > 0 }}"

- name: Assert Stork is installed on both clusters
  ansible.builtin.assert:
    that:
      - pxb_recovery_configuration_stork_installed_primary | default(false)
      - pxb_recovery_configuration_stork_installed_secondary | default(false)
    fail_msg: >-
      Stork BackupLocation CRD missing on primary={{ pxb_recovery_configuration_stork_installed_primary }},
      secondary={{ pxb_recovery_configuration_stork_installed_secondary }}. Install Stork on both clusters
      before running the configuration phase.

# BackupLocations
# ----------------------------

# Azure
- name: Create Azure BackupLocation on primary
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_primary }}"
    state: present
    definition: "{{ lookup('template', 'backup_location_azure.yaml') | from_yaml }}"
  when:
    - pxb_recovery_configuration_backup_location_type == 'azure'
    - pxb_recovery_configuration_stork_installed_primary | default(false)

- name: Create Azure BackupLocation on secondary
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_secondary }}"
    state: present
    definition: "{{ lookup('template', 'backup_location_azure.yaml') | from_yaml }}"
  when:
    - pxb_recovery_configuration_backup_location_type == 'azure'
    - pxb_recovery_configuration_stork_installed_secondary | default(false)

# S3
- name: Create S3 BackupLocation on primary
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_primary }}"
    state: present
    definition: "{{ lookup('template', 'backup_location_s3.yaml') | from_yaml }}"
  when:
    - pxb_recovery_configuration_backup_location_type == 's3'
    - pxb_recovery_configuration_stork_installed_primary | default(false)

- name: Create S3 BackupLocation on secondary
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_secondary }}"
    state: present
    definition: "{{ lookup('template', 'backup_location_s3.yaml') | from_yaml }}"
  when:
    - pxb_recovery_configuration_backup_location_type == 's3'
    - pxb_recovery_configuration_stork_installed_secondary | default(false)

# NFS
- name: Create NFS BackupLocation on primary
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_primary }}"
    state: present
    definition: "{{ lookup('template', 'backup_location_nfs.yaml') | from_yaml }}"
  when:
    - pxb_recovery_configuration_backup_location_type == 'nfs'
    - pxb_recovery_configuration_stork_installed_primary | default(false)

- name: Create NFS BackupLocation on secondary
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_secondary }}"
    state: present
    definition: "{{ lookup('template', 'backup_location_nfs.yaml') | from_yaml }}"
  when:
    - pxb_recovery_configuration_backup_location_type == 'nfs'
    - pxb_recovery_configuration_stork_installed_secondary | default(false)

# SchedulePolicy
# ----------------------------
- name: Create SchedulePolicy for PX-Backup
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_primary }}"
    state: present
    definition: "{{ lookup('template', 'schedule_policy.yaml') | from_yaml }}"

# ApplicationBackupSchedule
# ----------------------------
- name: Create ApplicationBackupSchedule for PX-Backup
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_primary }}"
    state: present
    definition: "{{ lookup('template', 'application_backup_schedule.yaml') | from_yaml }}"
