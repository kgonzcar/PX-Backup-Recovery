---
# Ensure govc is available and configured, then deploy and run FCD scripts

- name: Check if govc is installed
  ansible.builtin.stat:
    path: "{{ vsphere_fcd_cleanup_govc_binary_path }}"
  register: vsphere_fcd_cleanup_govc_stat

- name: Download govc binary archive
  ansible.builtin.get_url:
    url: "{{ vsphere_fcd_cleanup_govc_install_url }}"
    dest: /tmp/govc.gz
    mode: "0644"
  when:
    - not vsphere_fcd_cleanup_govc_stat.stat.exists
    - vsphere_fcd_cleanup_govc_install_url | default('') | length > 0

- name: Install govc binary
  ansible.builtin.command: "gunzip -c /tmp/govc.gz > {{ vsphere_fcd_cleanup_govc_binary_path }}"
  args:
    creates: "{{ vsphere_fcd_cleanup_govc_binary_path }}"
  when:
    - not vsphere_fcd_cleanup_govc_stat.stat.exists
    - vsphere_fcd_cleanup_govc_install_url | default('') | length > 0

- name: Ensure govc is executable
  ansible.builtin.file:
    path: "{{ vsphere_fcd_cleanup_govc_binary_path }}"
    mode: "0755"
  when:
    - not vsphere_fcd_cleanup_govc_stat.stat.exists
    - vsphere_fcd_cleanup_govc_install_url | default('') | length > 0

- name: Write govc environment file
  ansible.builtin.copy:
    dest: "{{ vsphere_fcd_cleanup_govc_env_file }}"
    mode: "0600"
    content: |
      # govc environment generated by Ansible
      {% for key, value in govc_env.items() %}
      export {{ key }}="{{ value }}"
      {% endfor %}

# -----------------------------
# Install scripts into /tmp dir
# -----------------------------

- name: Ensure FCD script directory exists
  ansible.builtin.file:
    path: "{{ vsphere_fcd_cleanup_script_dir }}"
    state: directory
    mode: "0755"

- name: Install FCD snapshot helper scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ vsphere_fcd_cleanup_script_dir }}/{{ item }}"
    mode: "0755"
  loop:
    - check_fcd_snapshots.sh
    - delete_fcd_snapshots.sh

# -----------------------------
# Run modes: check / cleanup / both
# -----------------------------

- name: Run FCD snapshot check (one-shot)
  ansible.builtin.command: "{{ vsphere_fcd_cleanup_script_dir }}/check_fcd_snapshots.sh"
  register: vsphere_fcd_cleanup_check
  changed_when: false
  ignore_errors: true
  when: vsphere_fcd_cleanup_run_mode in ['check', 'both']

- name: Show FCD snapshot check output
  ansible.builtin.debug:
    var: vsphere_fcd_cleanup_check.stdout_lines
  when:
    - vsphere_fcd_cleanup_run_mode in ['check', 'both']
    - vsphere_fcd_cleanup_check.stdout is defined

- name: Run FCD snapshot cleanup (one-shot)
  ansible.builtin.command: "{{ vsphere_fcd_cleanup_script_dir }}/delete_fcd_snapshots.sh"
  register: vsphere_fcd_cleanup_cleanup
  changed_when: true
  ignore_errors: true
  when: vsphere_fcd_cleanup_run_mode in ['cleanup', 'both']

# -----------------------------
# Optional cron in /tmp
# -----------------------------

- name: Ensure cron job for FCD snapshot cleanup
  ansible.builtin.cron:
    name: "PX FCD snapshot cleanup"
    user: "{{ ansible_user_id }}"
    job: "{{ vsphere_fcd_cleanup_script_dir }}/delete_fcd_snapshots.sh >> {{ vsphere_fcd_cleanup_log_file }} 2>&1"
    special_time: daily
  when: vsphere_fcd_cleanup_install_cron | default(false) | bool
