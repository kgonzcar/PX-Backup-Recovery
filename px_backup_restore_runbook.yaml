---
- name: Restore PX-Backup to secondary cluster
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/pxb_recovery.yaml
    - vars/pxb_recovery.secrets.yaml

  # pxb_restore_backup_name is loaded from vars/pxb_recovery.yaml.
  # Override at runtime with: -e pxb_restore_backup_name=my-backup

  roles:
    - pxb_restore
